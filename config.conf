# ============================================================
# ArgoX-Lite 非交互安装配置文件 / Non-interactive install config
#
# Usage:
#   bash argox.sh -f config.conf
#
# Only variables relevant to the sing-box VMess + WS + TLS + CDN
# node mode are kept. Xray-only keys (REALITY_*, PORT_HOPPING_*,
# INSTALL_PROTOCOLS, SUBSCRIBE) have been removed.
#
# Empty values fall back to script defaults.
# ============================================================


# ── Language / 语言 ─────────────────────────────────────────
# C = Chinese (default), E = English
L=''


# ── Domain / 域名 ────────────────────────────────────────────
# YOUR OWN DOMAIN that clients dial. Set this to a hostname in your
# own zone (e.g. node.example.com) — it is used for the VMess share
# link, the subscription URLs and the nginx server_name.
#
# 自有域名（客户端连接地址）。填你自己区域内的域名，例如 node.example.com。
# 它会用于 VMess 分享链接、订阅地址和 nginx server_name。
# 留空则回退到 SERVER，再回退到公共 CDN 默认值。
OWN_DOMAIN=''

# Legacy alias for the node address, kept so existing configs keep working.
# OWN_DOMAIN wins over SERVER when both are set.
# 旧版字段，兼容用；同时填写时 OWN_DOMAIN 优先。
SERVER=''

# TLS SNI used by the generated self-signed cert (nginx terminates TLS).
# TLS SNI（自签证书 CN，由 nginx 终止 TLS），留空使用 addons.mozilla.org。
TLS_SERVER=''

# User UUID (36 chars). Empty = auto-generated.
# 用户 UUID（36 位）。留空自动生成。
UUID=''

# WebSocket path (letters/digits/-_./@ only, max 64 chars).
# WebSocket 路径（字母/数字/-_./@，最长 64），留空使用 argox-ws-vm。
WS_PATH=''

# Node display name. Empty = hostname.
# 节点名称，留空使用主机名。
NODE_NAME=''


# ── Ports / 端口 ─────────────────────────────────────────────
# Internal sing-box VMess+WS port (nginx proxies to it).
# sing-box 内部监听端口，留空自动从 30000 起找空闲端口。
START_PORT=''

# nginx public port that the CDN / tunnel forwards to.
# nginx 对外端口（CDN 或隧道转发到此），留空使用 8080。
#
# ⚠️ 用 Token / 命名隧道时，Cloudflare 控制台里该隧道的 Public Hostname
#    必须指向 http://localhost:<这个端口>，否则表现为 HTTP 502。
NGINX_PORT=''

# TLS 在哪一层终止。
#   auto = 隧道模式由 Cloudflare 边缘终止（nginx 走明文 HTTP），
#          直连模式由本机 nginx 终止（自签证书）
#   yes  = 强制本机 nginx 做 TLS
#   no   = 强制明文 HTTP（前面一定有 CDN / 隧道）
# 留空 = auto
#
# 说明：Cloudflare 隧道/CDN 都在边缘终止 TLS，回源是明文 HTTP。
# 如果 origin 上 nginx 开了 ssl，会得到 400 "plain HTTP request was sent to HTTPS port"。
NGINX_TLS=''


# ── Optional overrides ───────────────────────────────────────
# Pin the sing-box version to install. Leave empty for the latest.
# 固定 sing-box 版本；留空使用最新。
# SINGBOX_VERSION='1.14.4'

# Override the GitHub mirror list (space separated path prefixes).
# 覆盖 GitHub 加速镜像列表（空格分隔的前缀）。
# SINGBOX_MIRRORS='https://ghfast.top/ https://gh-proxy.com/'

# Server IP / 服务器 IP (documented only; auto-detected by the script).
# 仅供记录，实际由脚本自动检测。
# SERVER_IP=''


# ============================================================
# Cloudflare Argo Tunnel — 自有隧道参数
# ============================================================
# 全部字段都可留空。留空 = 使用标准 CDN 架构，不启动 cloudflared。
#
# 启用 Argo 后，客户端连接 ARGO_DOMAIN（你自己的域名），流量路径：
#   Client → ARGO_DOMAIN:443 (Cloudflare 边缘)
#          → cloudflared (本机)
#          → nginx 127.0.0.1:NGINX_PORT (TLS 终止 + WS 反代)
#          → sing-box 127.0.0.1:START_PORT (VMess + WS inbound)

# 是否启用 Argo 隧道（默认启用，与原版 ArgoX 一致）。
#   y / yes / 1 / true  = 启用隧道
#   n / no  / 0 / false = 直连 CDN（需要你自己把域名解析到本机）
#   留空 = 启用（默认）
#
# 隧道有三种跑法，按填了什么自动判断：
#   A. 填了 ARGO_AUTH / ARGO_CRED_FILE / ARGO_TUNNEL_NAME / ARGO_TUNNEL_ID
#      -> 命名隧道，用你自己的隧道 + 你自己的域名（推荐）
#   B. 只填 ARGO_AUTH 为 Token（Base64，120-250 字符）
#      -> Token 模式，域名在 Cloudflare 控制台的隧道配置里指定
#   C. 什么都不填
#      -> 快速隧道，cloudflared 自动分配随机 *.trycloudflare.com 域名
#         （无需账号，重启后域名会变）
ARGO=''

# 【自有域名】隧道对外域名，例如 node.example.com。
# 留空则回退到 OWN_DOMAIN。
ARGO_DOMAIN=''

# 【认证方式】三选一，其余留空。
#   1) 凭据 JSON（推荐，含 TunnelSecret + TunnelID）：
#      ARGO_AUTH='{"AccountTag":"...","TunnelSecret":"...","TunnelID":"..."}'
#   2) 隧道 Token（Base64-like，120-250 字符）：
#      ARGO_AUTH='eyJhIjoiOWNj...'
#   3) 留空 + 用 ARGO_CRED_FILE 指向已有凭据文件，或用 ARGO_TUNNEL_NAME。
ARGO_AUTH=''

# 【自有隧道 ID】直接指定隧道 ID，优先于 ARGO_AUTH 里的 TunnelID。
# 适用于你已经在 Cloudflare 建好隧道、只想复用的情况。
ARGO_TUNNEL_ID=''

# 【自有隧道名】没有 ID/凭据时，用 cloudflared tunnel run <name> 启动。
# 需要本机已有 ~/.cloudflared/cert.pem（cloudflared tunnel login 生成）。
ARGO_TUNNEL_NAME=''

# 【复用已有凭据文件】指向一个已存在的 tunnel 凭据 JSON（绝对路径）。
# 设置后会从该文件读取凭据，并在 tunnel.yml 里引用它，而不是覆盖写入。
ARGO_CRED_FILE=''

# 【本地转发地址】tunnel.yml 里 ingress 的 service。
# 留空默认 http://localhost:${NGINX_PORT}。若你想直接转发到别的端口可改这里。
ARGO_INGRESS_SERVICE=''

# 【额外域名】同一个隧道上再挂几个域名（空格分隔）。
# 会为每个域名生成一条 ingress 规则，都转发到同一个本地地址。
ARGO_EXTRA_HOSTS=''

# 【额外 cloudflared 参数】追加到启动命令末尾，例如：
#   ARGO_CF_ARGS='--loglevel debug --protocol http2'
ARGO_CF_ARGS=''
