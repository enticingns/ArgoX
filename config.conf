# ============================================================
# ArgoX-Lite 非交互安装配置文件 / Non-interactive install config
#
# Usage:
#   bash argox.sh -f config.conf
#
# Only variables relevant to the sing-box VMess + WS + TLS + CDN
# node mode are kept. Xray-only keys (REALITY_*, PORT_HOPPING_*,
# ARGO_*, INSTALL_PROTOCOLS, SUBSCRIBE) have been removed.
#
# Empty values fall back to script defaults.
# ============================================================


# ── Language / 语言 ─────────────────────────────────────────
# C = Chinese (default), E = English
L=''


# ── CDN / TLS / Node ─────────────────────────────────────────
# CDN domain the clients dial (must be proxied through your CDN,
# e.g. Cloudflare). Leave empty for the built-in default (skk.moe).
# 客户端连接的 CDN 域名（如 skk.moe / ip.sb / 你自己的域名），留空使用 skk.moe。
SERVER=''

# TLS SNI used by the generated self-signed cert.
# TLS SNI（自签证书 CN），留空使用 addons.mozilla.org。
TLS_SERVER=''

# User UUID (36 chars). Empty = auto-generated.
# 用户 UUID（36 位）。留空自动生成。
UUID=''

# WebSocket path (letters/digits/-_./@ only, max 64 chars).
# WebSocket 路径（字母/数字/-_./@，最长 64），留空使用 argox-ws-vm。
WS_PATH=''

# Node display name. Empty = hostname.
# 节点名称，留空使用主机名。
NODE_NAME=''


# ── Ports / 端口 ─────────────────────────────────────────────
# Internal sing-box VMess+WS port (nginx proxies to it).
# sing-box 内部监听端口，留空使用 30000。
START_PORT=''

# nginx public port that the CDN forwards to.
# nginx 对外端口，留空使用 8080。
NGINX_PORT=''


# ── Optional overrides ───────────────────────────────────────
# Pin the sing-box version to install. Leave empty for the latest.
# 固定 sing-box 版本；留空使用最新。
# SINGBOX_VERSION='1.14.4'


# Server IP / 服务器 IP (documented only; auto-detected by the script).
# 仅供记录，实际由脚本自动检测。
# SERVER_IP=''


# ── Cloudflare Argo Tunnel ───────────────────────────────────
# y / yes = enable Argo Tunnel; empty / n = use standard CDN only (default).
# Argo 模式：y=启用 cloudflared 隧道（需配合 ARGO_AUTH 或 ARGO_DOMAIN）
#           空/n=使用标准 CDN + nginx 架构（默认）
# 启用 Argo 后，客户端连接 ARGO_DOMAIN，流量经 cloudflared 转发到本机 nginx。
ARGO=''

# Argo Tunnel 域名（如 my-tunnel.domain.com）。启用 Argo 后用于生成分享链接。
ARGO_DOMAIN=''

# Argo 认证信息（三种格式任选一）。留空 = 使用标准 CDN 模式（无 Argo）。
#   JSON:      ARGO_AUTH='{"AccountTag":"...","TunnelSecret":"...","TunnelID":"..."}'
#   Token:     ARGO_AUTH='eyJhIjoiOWNj...'（Base64-like，120-250 字符）
#   API Token: ARGO_AUTH='01ab23cd45ef6789ghij0123klmnopqrs456tuvw'（40 字符）
ARGO_AUTH=''
